<!DOCTYPE html>
<html>
<head>
  <title>ESO Pen & Crit Damage Calculator</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .header-container {
      display: flex;
      align-items: center;
    }

    #export-button {
      padding: 0.5em 1em;
      font-size: 0.9em;
      cursor: pointer;
      align-items: right;
    }
  </style>
</head>
<body>
  <div class="header-container">
    <h1>ESO Penetration & Crit Calculator <span id="patch-version"></span></h1>
  </div>

    <div class="main-content-wrapper">
    <div class="left-panel">
      <div class="presets-section">
        <h2>Presets</h2>
        <div id="presets-container">
          <!-- JS will populate this -->
        </div>
      </div>
      <div class="configuration-section" id="configuration-section">
        <h2>Configuration</h2>
        <div class="config-item">
          <label for="raceSelect">Race:</label>
          <select id="raceSelect">
            <option value="">None</option>
          </select>
        </div>
        <div class="config-item">
          <label for="mundusSelect">Mundus:</label>
          <select id="mundusSelect">
            <option value="">None</option>
          </select>
        </div>
        <div class="config-item">
          <label for="mythicSelect">Mythic:</label>
          <select id="mythicSelect">
            <option value="">None</option>
          </select>
        </div>
        <div class="config-item">
          <label for="mainSkillLineSelect">Main Skill Line:</label>
          <select id="mainSkillLineSelect">
            <option value="">None</option>
          </select>
        </div>
        <div class="config-item">
          <label for="skillLine2Select">Skill Line 2:</label>
          <select id="skillLine2Select">
            <option value="">None</option>
          </select>
        </div>
        <div class="config-item">
          <label for="skillLine3Select">Skill Line 3:</label>
          <select id="skillLine3Select">
            <option value="">None</option>
          </select>
        </div>
      </div>
      <div class="links-section">
        <h2>Links</h2>
        <div class="link-item">
          Offline Builds <a href="https://github.com/cbanker721/ESOCalculator/archive/refs/heads/mainline.zip" target="_blank">(Latest)</a>
          <a href="https://github.com/cbanker721/ESOCalculator/releases">(Stable)</a>
        </div>
        <button id="export-button" title="Copy a shareable link with your current selections to the clipboard.">Export Overrides</button>
      </div>
    </div>

    <div class="container">
      <div class="calculator-section">
        <div class="calculator-header">
          <h2>Penetration <span class="total-display">(Total: <span id="pen-total">0</span> / 18200)</span></h2>
        </div>
        <table id="penetration-table">
          <thead>
            <tr>
              <th>Category</th>
              <th>Source</th>
              <th>Value</th>
              <th>Enabled</th>
            </tr>
          </thead>
          <tbody id="penetration-tbody">
            <!-- JS will populate this -->
          </tbody>
        </table>
      </div>
  
      <div class="calculator-section">
        <div class="calculator-header">
          <h2>Critical Damage <span class="total-display">(Total: <span id="crit-total">0%</span> / 125%)</span></h2>
        </div>
        <table id="crit-damage-table">
          <thead>
            <tr>
              <th>Category</th>
              <th>Source</th>
              <th>Value (%)</th>
              <th>Enabled</th>
            </tr>
          </thead>
          <tbody id="crit-damage-tbody">
            <!-- JS will populate this -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="enums/enums.js"></script>
  <script src="enums/sets.js"></script>
  <script src="data/gear.js"></script>
  <script src="data/skills.js"></script>
  <script src="data/race.js"></script>
  <script src="data/class.js"></script>
  <script src="data/modifiers.js"></script>
  <script src="data/mundus.js"></script>
  <script src="data/sets.js"></script>
  <script src="data/cp.js"></script>
  <script src="data/data.js"></script>
  <script src="model/preset.js"></script>
  <script src="util/serialization.js"></script>
  <script src="interface/calculator/override.js"></script>
  <script src="interface/calculator/data.js"></script>
  <script src="interface/calculator/calculator.js"></script>
</body>
</html>
